name: Build Debug APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # lint في وظيفة منفصلة عمداً: في تشغيل 47 استغرق أكثر من ٥٥ دقيقة بينما
  # البناء انتهى في ٤٫٥. بوابةٌ تؤخّر كل دفعة ساعةً تُعطَّل بعد أسبوع فلا
  # تحرس شيئاً. هنا يعمل بالتوازي، بسقف زمني، ولا يحجز الـAPK ولا الاختبارات.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint
        run: ./gradlew :androidApp:lintDebug --no-daemon

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # حارس المسارات اليتيمة — يفشل على أي شاشة مسجَّلة لا يصلها مدخل
      - name: Check orphan routes
        run: python3 tools/check_orphan_routes.py

      # يسبق البناء لأنه يكشف في ثانية ما يكلّف aapt2 دقيقتين ثم يبلّغ عنه
      # برسالة لا تذكر السطر ولا السبب
      - name: Check string resources
        run: python3 tools/check_strings.py

      # لا نصّ ديني بلا مصدر ودرجة — قاعدة AGENTS.md مفروضةً آلياً
      - name: Check religious sources
        run: python3 tools/check_religious_sources.py

      # نصّ دعائي مكتوب في Kotlin يفلت من الحارس السابق (يفحص JSON وحدها)
      - name: Check devotional text in code
        run: python3 tools/check_devotional_in_code.py

      # إحداثيات كل مدينة داخل صندوق حدود بلدها — تبديلٌ بين الطول والعرض
      # لا يُنتج رقماً غريباً ظاهراً بل جدولَ صلاةٍ لمدينةٍ أخرى
      - name: Check city coordinates
        run: python3 tools/check_cities.py

      # رمز يُستعمل بلا استيراد — كسر البناء مرّتين في يوم واحد
      - name: Check imports
        run: python3 tools/check_imports.py

      # عطبان عاشا في البيانات ولم يكشفهما مترجمٌ ولا اختبار: بحثٌ يعطي
      # صفر نتائج دائماً، وبسملةٌ ملتصقةٌ بأوّل آيةٍ في ١١٢ سورة
      - name: Check Quran data
        run: python3 tools/check_quran_data.py

      # عمودٌ جديد في .sq يعمل على تثبيتٍ نظيف ويُسقط كلَّ ترقية —
      # ولا يظهر في CI لأنّ كل تشغيلٍ هنا تثبيتٌ نظيف
      - name: Check schema vs migrations
        run: python3 tools/check_schema.py

      # ٦٤٧ نصّاً عربياً كان مضمَّناً في Kotlin — والسقف يمنع العودة
      - name: Check hardcoded UI strings
        run: python3 tools/check_hardcoded_ui.py

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew :shared:testDebugUnitTest :androidApp:testDebugUnitTest --no-daemon

      # حاجز التوقيع: يجب أن يفشل bundleRelease بلا مفتاح، برسالة واضحة،
      # بدل أن يسقط صامتاً إلى مفتاح debug كما كان يفعل. نتحقّق أن الحاجز
      # نفسه يعمل — لا نكتفي بوجوده في الكود.
      - name: Verify release signing guard fails without a key
        run: |
          if ./gradlew :androidApp:bundleRelease --no-daemon > /tmp/rel.log 2>&1; then
            echo "::error::bundleRelease نجح بلا مفتاح توقيع — الحاجز لا يعمل"
            exit 1
          fi
          if grep -q "بناء إصدارية بلا مفتاح توقيع" /tmp/rel.log; then
            echo "الحاجز يعمل: فشل البناء بالرسالة المتوقَّعة"
          else
            echo "::error::فشل bundleRelease لسبب آخر غير الحاجز:"
            tail -40 /tmp/rel.log
            exit 1
          fi

      # ═══ بناءٌ إصداريٌّ مصغَّرٌ فعلاً ═══
      #
      # كان CI يبني `assembleDebug` وحدَه، ويستدعي `bundleRelease` ليتحقّق
      # أنّه **يفشل** بلا مفتاح. فلم يكن R8 يعمل في أيّ بناءٍ قطّ — وكلُّ
      # ثغرةٍ في `proguard-rules.pro` تبقى مخفيّةً حتى أوّل نسخةٍ تُنشر،
      # حيث تظهر انهياراً عند مستخدمٍ لا مطوّر. وقد كان فيها فعلاً قواعدُ
      # لمكتبتين محذوفتين (Ktor وRevenueCat) ولا قاعدةَ للودجت.
      #
      # المفتاحُ هنا مؤقّتٌ يُولَّد ويُرمى: الغرضُ إثباتُ أنّ R8 يمرّ
      # ويُنتج حزمةً، لا توقيعُ نسخةٍ للنشر.
      - name: Build a minified release (R8 gate)
        run: |
          keytool -genkeypair -v -keystore /tmp/ci.jks \
            -storepass ci_only -keypass ci_only -alias ci \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI, O=CI, C=IQ" > /dev/null 2>&1
          KEYSTORE_FILE=/tmp/ci.jks KEYSTORE_PASSWORD=ci_only \
          KEY_ALIAS=ci KEY_PASSWORD=ci_only \
            ./gradlew :androidApp:assembleRelease --no-daemon
          rm -f /tmp/ci.jks
          # قواعدُ ناقصة يكتبها R8 هنا — وجودُ الملفّ غيرَ فارغ يعني ثغرة
          M=androidApp/build/outputs/mapping/release/missing_rules.txt
          if [ -s "$M" ]; then
            echo "::error::R8 يبلّغ عن قواعد ناقصة:"; cat "$M"; exit 1
          fi

      # اسم ملف يحمل رقم البناء ومعرّف الكومِت — يمنع الكاش ويوضّح النسخة
      - name: Rename APK
        run: |
          mkdir -p out
          cp androidApp/build/outputs/apk/debug/*.apk \
             "out/rafiq-aldhikr-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rafiq-aldhikr-debug
          path: out/*.apk

      # نسخة قابلة للتنزيل المباشر من صفحة Releases (أسهل على الموبايل)
      - name: Publish to debug-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "نسخة تجريبية — آخر بناء"
          prerelease: true
          body: |
            نسخة Debug تلقائية من آخر تعديلات الفرع.

            • رقم البناء: ${{ github.run_number }}
            • الكومِت: ${{ github.sha }}

            نزّل ملف الـ APK أدناه (اسمه يحمل رقم البناء) وثبّته.
            إذا لم يتحدّث التطبيق: احذف القديم أولاً ثم ثبّت الجديد.
            للتأكد من النسخة: افتح التطبيق → الإعدادات → حول التطبيق (سيظهر رقم البناء).
          files: out/*.apk
